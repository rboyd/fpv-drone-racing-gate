<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="120mm" viewBox="0 0 180 120">
<rect width="180" height="120" fill="white"/>
<g font-family="Arial" fill="#152c43">
<text x="10" y="12" font-size="5" font-weight="bold">SADDLE / WASHER SLOT TEMPLATE — 1:1</text>
<text x="10" y="21" font-size="3.3">Print at 100%. Verify the 50 mm scale bar before marking.</text>
<rect x="30" y="37" width="60" height="40" fill="none" stroke="black" stroke-width=".25"/>
<rect x="35.4" y="44" width="3.2" height="6" fill="#888" stroke="black" stroke-width=".2"/>
<rect x="35.4" y="64" width="3.2" height="6" fill="#888" stroke="black" stroke-width=".2"/>
<rect x="81.4" y="44" width="3.2" height="6" fill="#888" stroke="black" stroke-width=".2"/>
<rect x="81.4" y="64" width="3.2" height="6" fill="#888" stroke="black" stroke-width=".2"/>
<line x1="60" y1="31" x2="60" y2="83" stroke="#999" stroke-width=".2" stroke-dasharray="2 1"/>
<text x="99" y="42" font-size="3.5">60 x 40 footprint</text>
<text x="99" y="50" font-size="3.5">Slots: 3.2 x 6 mm</text>
<text x="99" y="58" font-size="3.5">Centers: +/-23, +/-10</text>
<text x="99" y="66" font-size="3.5">Dashed line = pipe axis</text>
<path d="M30 90 v5 M30 93 h50 M80 90 v5" fill="none" stroke="black" stroke-width=".4"/>
<text x="49" y="101" font-size="4">50 mm</text>
<text x="10" y="113" font-size="3.2">Use a scrap pad behind the face; keep tie heads on the rear. Do not crush the flutes.</text>
</g></svg>